[versions]
agp = "9.1.1"
kotlin = "2.2.20"
ksp = "2.3.6"
hilt = "2.60.1"
room = "2.8.4"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
